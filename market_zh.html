<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一起便了么 - Q萌陪伴的隐私排便健康记录 App</title>
    <style>
        :root {
            --bg-color: #fcf9f2;
            --card-bg: #ffffff;
            --primary-color: #d9822b;
            --primary-hover: #c47222;
            --text-color: #2c2825;
            --text-muted: #7a736e;
            --border-color: #eee7dd;
            --highlight-bg: #fff5e6;
            --accent-green: #eaf5ea;
            --accent-green-text: #2e7d32;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Nav */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 700;
            font-size: 20px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background-color: var(--highlight-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-left: 20px;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        /* Hero Section */
        .hero {
            padding: 60px 0 40px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            background-color: var(--highlight-bg);
            color: var(--primary-color);
            font-size: 13px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-color);
            margin: 0 0 16px 0;
            line-height: 1.25;
        }

        .hero h1 span {
            color: var(--primary-color);
        }

        .hero p {
            font-size: 18px;
            color: var(--text-muted);
            max-width: 620px;
            margin: 0 auto 32px;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--primary-color);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 6px 20px rgba(217, 130, 43, 0.25);
            transition: all 0.2s ease;
        }

        .cta-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        /* App Preview Frame */
        .hero-mockup {
            margin-top: 50px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .mockup-card {
            background-color: var(--bg-color);
            border-radius: 16px;
            padding: 20px;
            width: 240px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .mockup-card .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .mockup-card h4 {
            margin: 8px 0 4px;
            font-size: 16px;
            color: var(--primary-color);
        }

        .mockup-card p {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0;
        }

        /* Features Section */
        .features {
            padding: 60px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 48px;
        }

        .section-title h2 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 10px;
        }

        .section-title p {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .feature-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 16px rgba(0,0,0,0.02);
        }

        .feature-icon {
            width: 48px;
            height: 48px;
            background-color: var(--highlight-bg);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
        }

        .feature-card h3 {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 8px;
        }

        .feature-card p {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.6;
        }

        /* Metaphor Showcase */
        .metaphor-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            margin: 40px 0;
        }

        .metaphor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
            margin-top: 24px;
            text-align: center;
        }

        .metaphor-item {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px 8px;
        }

        .metaphor-item .emoji {
            font-size: 28px;
            display: block;
            margin-bottom: 6px;
        }

        .metaphor-item .name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            display: block;
        }

        .metaphor-item .type {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Privacy Banner */
        .privacy-banner {
            background-color: var(--accent-green);
            border: 1px solid #c8e6c9;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 40px 0;
        }

        .privacy-banner .icon {
            font-size: 40px;
        }

        .privacy-banner h3 {
            margin: 0 0 4px;
            font-size: 18px;
            color: var(--accent-green-text);
        }

        .privacy-banner p {
            margin: 0;
            font-size: 14px;
            color: #388e3c;
        }

        /* Footer CTA & Links */
        .bottom-cta {
            text-align: center;
            padding: 60px 0;
        }

        .bottom-cta h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .footer {
            border-top: 1px solid var(--border-color);
            padding: 30px 0;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer-links {
            margin-bottom: 12px;
        }

        .footer-links a {
            color: var(--primary-color);
            text-decoration: none;
            margin: 0 10px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .hero h1 {
                font-size: 30px;
            }
            .hero p {
                font-size: 15px;
            }
            .metaphor-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .privacy-banner {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
